name: Condition A — Vibe build and data checks

on:
  push:
    branches:
      - condition/vibe
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check shared educational data
        run: npm test
      - name: TypeScript check
        run: npm run typecheck
      - name: Build Next.js
        run: npm run build
