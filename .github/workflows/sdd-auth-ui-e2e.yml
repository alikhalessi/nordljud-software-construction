name: SDD auth-entry browser acceptance (CR-SDD-02)

on:
  push:
    branches: [condition/spec-driven]
    paths:
      - 'app/experience.tsx'
      - 'app/globals.css'
      - 'tests/e2e/**'
      - 'playwright.config.ts'
      - 'package.json'
      - '.github/workflows/sdd-auth-ui-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-discoverability:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Install real Chromium for browser test
        run: npx playwright install --with-deps chromium
      - name: Test entry point from home on desktop and mobile
        run: npx playwright test tests/e2e/auth-entry.spec.ts
