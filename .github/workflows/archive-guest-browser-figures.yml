name: Archive real anonymous browser screenshots in repo

# One-time archival workflow. No screenshot is generated, retouched or replaced
# by an illustration. Downloads exact prior GitHub Actions artifacts and commits
# the original PNG bytes for reproducible course figures.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/archive-guest-browser-figures.yml']
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Download the actual Playwright artifact ZIP contents from fixed run 38485026386
        uses: actions/download-artifact@v4
        with:
          run-id: 38485026386
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: playwright-*
          path: downloaded
          merge-multiple: false
      - name: Verify and copy genuine anonymous screenshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evaluation/screenshots
          count=0
          for method in Vibe God_Mode SDD; do
            folder="downloaded/playwright-$method"
            test -d "$folder"
            for figure in A2-mission sticka-second-sense guest-A2-exercises-complete; do
              original="$method-$figure.png"
              actual="$(find "$folder" -type f -name "$original" -print -quit)"
              if [ -z "$actual" ]; then
                echo "::error::Missing actual screenshot $original"
                find "$folder" -type f | head -40
                exit 1
              fi
              normalized="$(echo "$method-$figure" | tr '[:upper:]' '[:lower:]' | tr '_' '-')"
              destination="evaluation/screenshots/$normalized.png"
              cp "$actual" "$destination"
              file "$destination"
              # Validate the PNG file's eight-byte signature. Do not process image pixels.
              test "$(head -c 8 "$destination" | od -An -tx1 | tr -d ' \n')" = "89504e470d0a1a0a"
              count=$((count+1))
            done
          done
          test "$count" -eq 9
          echo "Copied $count ORIGINAL PNG screenshots"
      - name: Add durable figure provenance and privacy scope
        shell: bash
        run: |
          cat > evaluation/screenshots/README.md <<'EOT'
          # Genuine anonymous Chromium screenshots — immutable evaluation evidence

          These nine PNGs are exact copies from the GitHub Actions artifact ZIPs of
          https://github.com/alikhalessi/nordljud-software-construction/actions/runs/38485026386
          They were generated by the same shared Playwright guest evaluator, while each
          frozen A/B/C branch was independently run locally in Chromium.

          - `*-a2-mission.png`: first A2 mission before any login.
          - `*-sticka-second-sense.png`: detail pane AFTER selecting the second `sticka`
            entry and BEFORE the same test assertion (Vibe's detail still said "knit").
          - `*-guest-a2-exercises-complete.png`: both A2 quiz groups completed in a
            guest browser before a reload check.

          They show *guest* sessions with no real Google identities, tokens, user profiles,
          private learner records or signed-in email addresses. Do not claim they prove
          Google OAuth, cloud persistence, actual speech playback or two-account RLS.

          GitHub Actions source artifacts were named `playwright-Vibe`,
          `playwright-God_Mode` and `playwright-SDD`. In case of visual discrepancies,
          audit the source run and the Git SHA instead of retouching any image.
          EOT
      - name: Commit copies without modifying any experimental source branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evaluation/screenshots
          if git diff --cached --quiet; then
            echo "Screenshot bytes already in main; no new commit"
          else
            git commit -m "evidence: archive 9 genuine anonymous Chromium screenshots from CI"
            git push origin HEAD:main
          fi
