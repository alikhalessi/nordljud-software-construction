name: SDD initialize official GitHub Spec Kit

on:
  push:
    branches: [condition/spec-driven]
    paths:
      - '.github/workflows/sdd-speckit-bootstrap.yml'
  workflow_dispatch:

# Spec Kit is installed and run *as a real CLI* on a GitHub runner.
# The agent-generated spec/plan/tasks docs are created separately after this.
permissions:
  contents: write

jobs:
  initialize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify isolated baseline / avoid clobbering initialized folder
        id: check
        run: |
          if [ -e .specify ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Already initialized; not overwriting existing Spec Kit artifacts"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: astral-sh/setup-uv@v6
        if: steps.check.outputs.needed == 'true'
      - name: Run the official Spec Kit CLI v1.1.3
        if: steps.check.outputs.needed == 'true'
        run: |
          uvx --from specify-cli==1.1.3 specify init --here --force --non-interactive --integration copilot --ignore-agent-tools --script sh
          echo "=== Spec Kit CLI installed template evidence ==="
          find .specify -maxdepth 3 -type f | sort | head -40
      - name: Commit generated official toolkit scaffolding
        if: steps.check.outputs.needed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .specify .github || true
          if ! git diff --cached --quiet; then
            git commit -m "sdd: initialize official Spec Kit CLI v1.1.3 scaffold"
            git push origin HEAD:condition/spec-driven
          fi
