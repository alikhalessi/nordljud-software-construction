name: Nordljud God Mode checks

on:
  push:
    branches:
      - condition/god-mode
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify frozen Swedish inputs
        run: npm test
      - name: Check TypeScript
        run: npm run typecheck
      - name: Build
        run: npm run build
